name: Build Conversor BOED APK

on:
  push:
    paths:
      - "boed-converter/**"
      - ".github/workflows/build-boed-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boed-converter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: conversor-boed-debug-apk
          path: boed-converter/app/build/outputs/apk/debug/app-debug.apk
