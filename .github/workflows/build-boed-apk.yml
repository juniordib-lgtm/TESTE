name: Build Conversor BOED APK

on:
  push:
    paths:
      - "boed-converter/**"
      - ".github/workflows/build-boed-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boed-converter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: conversor-boed-debug-apk
          path: boed-converter/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit APK to repository
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ConversorBOED-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/ConversorBOED-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit."
          else
            git commit -m "chore: update built APK [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
